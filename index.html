<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gerenciamento - Lanchonete</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🍔 Sistema de Gestão - Lanchonete</h1>
            <div class="auth-section">
                <button id="authorize-btn" class="google-btn">Entrar com Google</button>
                <button id="logout-btn" class="logout-btn" style="display: none;">
                    <span id="user-name"></span> | Sair
                </button>
            </div>
        </header>

        <div id="loading" class="loading" style="display: none;">
            <p id="loading-message">Carregando...</p>
        </div>

        <div id="login-message" class="login-message">
            <p>🔐 Faça login com sua conta Google para acessar o sistema</p>
        </div>

        <div id="app-content" style="display: none;">
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('search')">🔍 Pesquisa de Códigos</button>
                <button class="tab-btn" onclick="switchTab('table')">📊 Tabela de Edição</button>
            </div>

            <!-- Aba de Pesquisa -->
            <div id="search-tab" class="tab-content active">
                <div class="search-section">
                    <div class="hole-info">
                        <h2>Códigos Faltantes na Sequência</h2>
                        <div id="hole-display" class="hole-display">
                            <span class="label">Próximo código disponível:</span>
                            <span id="current-hole" class="hole-number">--</span>
                        </div>
                        <div class="hole-stats">
                            <span>Total de falhas encontradas: <strong id="total-holes">0</strong></span>
                        </div>
                    </div>
                    <button id="next-hole-btn" class="action-btn" onclick="showNextHole()">Próximo Código ▶</button>
                </div>

                <div class="add-product-section">
                    <h3>Adicionar Produto neste Código</h3>
                    <form id="add-product-form" class="product-form">
                        <div class="form-group">
                            <label for="hole-code">Código:</label>
                            <input type="text" id="hole-code" readonly>
                        </div>
                        <div class="form-group">
                            <label for="hole-description">Descrição:</label>
                            <input type="text" id="hole-description" required>
                        </div>
                        <div class="form-group">
                            <label for="hole-un">UN:</label>
                            <input type="text" id="hole-un" required>
                        </div>
                        <button type="submit" class="submit-btn">✅ Adicionar Produto</button>
                    </form>
                </div>
            </div>

            <!-- Aba da Tabela -->
            <div id="table-tab" class="tab-content">
                <div class="table-controls">
                    <div class="search-box">
                        <input type="text" id="table-search" placeholder="Buscar por código ou descrição..." onkeyup="filterTable()">
                    </div>
                    <button class="refresh-btn" onclick="loadSheetData()">🔄 Atualizar Dados</button>
                </div>
                <div class="table-container">
                    <table id="products-table">
                        <thead>
                            <tr>
                                <th>Código</th>
                                <th>Descrição</th>
                                <th>UN</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody id="table-body"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Modal de Edição -->
        <div id="edit-modal" class="modal" style="display:none;">
            <div class="modal-content">
                <span class="close" onclick="closeEditModal()">&times;</span>
                <h3>Editar Produto</h3>
                <form id="edit-form">
                    <input type="hidden" id="edit-row">
                    <div class="form-group">
                        <label for="edit-code">Código:</label>
                        <input type="text" id="edit-code" readonly>
                    </div>
                    <div class="form-group">
                        <label for="edit-description">Descrição:</label>
                        <input type="text" id="edit-description" required>
                    </div>
                    <div class="form-group">
                        <label for="edit-un">UN:</label>
                        <input type="text" id="edit-un" required>
                    </div>
                    <div class="modal-actions">
                        <button type="submit" class="save-btn">💾 Salvar</button>
                        <button type="button" class="cancel-btn" onclick="closeEditModal()">Cancelar</button>
                    </div>
                </form>
            </div>
        </div>

        <div id="error-message" class="error-message" style="display: none;"></div>
    </div>

    <!-- ORDEM CRÍTICA DOS SCRIPTS -->
    <!-- 1. Primeiro carrega o seu script para registrar as funções (onload) -->
    <script src="script.js"></script>
    
    <!-- 2. Google Sheets API -->
    <script async defer src="https://apis.google.com/js/api.js" onload="onGapiLoad()"></script>
    
    <!-- 3. Google Identity Services (Obrigatório para o OAuth funcionar hoje em dia) -->
    <script async defer src="https://accounts.google.com/gsi/client" onload="onGisLoad()"></script>
</body>
</html>
