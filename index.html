<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gerenciamento - Lanchonete</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🍔 Sistema de Gestão - Lanchonete</h1>
            <div class="auth-section">
                <button id="authorize-btn" class="google-btn">
                    <svg width="20" height="20" viewBox="0 0 24 24">
                        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/>
                        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                    </svg>
                    Entrar com Google
                </button>
                <button id="logout-btn" class="logout-btn" style="display: none;">
                    <span id="user-name"></span> | Sair
                </button>
            </div>
        </header>

        <div id="loading" class="loading" style="display: none;">
            <div class="spinner"></div>
            <p id="loading-message">Carregando...</p>
        </div>

        <div id="login-message" class="login-message">
            <p>🔐 Faça login com sua conta Google para acessar o sistema</p>
        </div>

        <div id="app-content" style="display: none;">
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('search')">🔍 Pesquisa de Códigos Faltantes</button>
                <button class="tab-btn" onclick="switchTab('table')">📊 Tabela de Visualização/Edição</button>
            </div>

            <div id="search-tab" class="tab-content active">
                <div class="search-section">
                    <div class="hole-info">
                        <h2>Códigos Faltantes na Sequência</h2>
                        <div id="hole-display" class="hole-display">
                            <span class="label">Próximo código disponível:</span>
                            <span id="current-hole" class="hole-number">--</span>
                        </div>
                        <div class="hole-stats">
                            <span>Total de falhas encontradas: <strong id="total-holes">0</strong></span>
                        </div>
                    </div>
                    <button id="next-hole-btn" class="action-btn" onclick="showNextHole()">
                        Próximo Código ▶
                    </button>
                </div>

                <div class="add-product-section">
                    <h3>Adicionar Produto com Código Faltante</h3>
                    <form id="add-product-form" class="product-form">
                        <div class="form-group">
                            <label for="hole-code">Código:</label>
                            <input type="text" id="hole-code" readonly>
                        </div>
                        <div class="form-group">
                            <label for="hole-description">Descrição:</label>
                            <input type="text" id="hole-description" required>
                        </div>
                        <div class="form-group">
                            <label for="hole-un">UN:</label>
                            <input type="text" id="hole-un" required>
                        </div>
                        <button type="submit" class="submit-btn">✅ Adicionar Produto</button>
                    </form>
                </div>
            </div>

            <div id="table-tab" class="tab-content">
                <div class="table-controls">
                    <div class="search-box">
                        <input type="text" id="table-search" placeholder="Buscar por código ou descrição..." onkeyup="filterTable()">
                    </div>
                    <button class="refresh-btn" onclick="loadSheetData()">🔄 Atualizar Dados</button>
                </div>
                <div class="table-container">
                    <table id="products-table">
                        <thead>
                            <tr>
                                <th>Código</th>
                                <th>Descrição</th>
                                <th>UN</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody id="table-body"></tbody>
                    </table>
                </div>
                
                <div id="edit-modal" class="modal">
                    <div class="modal-content">
                        <span class="close" onclick="closeEditModal()">&times;</span>
                        <h3>Editar Produto</h3>
                        <form id="edit-form">
                            <input type="hidden" id="edit-row">
                            <div class="form-group">
                                <label for="edit-code">Código:</label>
                                <input type="text" id="edit-code" readonly>
                            </div>
                            <div class="form-group">
                                <label for="edit-description">Descrição:</label>
                                <input type="text" id="edit-description" required>
                            </div>
                            <div class="form-group">
                                <label for="edit-un">UN:</label>
                                <input type="text" id="edit-un" required>
                            </div>
                            <div class="modal-actions">
                                <button type="submit" class="save-btn">💾 Salvar</button>
                                <button type="button" class="cancel-btn" onclick="closeEditModal()">Cancelar</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
        
        <div id="error-message" class="error-message" style="display: none;"></div>
    </div>

    <script src="https://apis.google.com/js/api.js"></script>
    <script src="script.js"></script>
</body>
</html>
